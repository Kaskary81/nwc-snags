    <button class="btn" id="gtalk">Discussion</button>
    <button class="btn" id="gpdf">Export PDF</button>
    <button class="btn" id="gcols">Columns</button>
    <span class="hint" id="gcount"></span></div>`;
  const allOn=rows.length&&rows.every(r=>PICKED.has(r.id));
  const head=`<thead><tr><th class="corner"><input type="checkbox" id="gall"${allOn?' checked':''}></th>${cs.map((c,i)=>
      `<th data-c="${i}" data-k="${c.k}" class="${i===0?'stick1':''}" draggable="${canEdit()}" style="width:${colW(c)}px;min-width:${colW(c)}px">${
        esc(c.t)}${GRID.sort.k===c.k?(GRID.sort.dir>0?' ▲':' ▼'):''}<span class="cr" data-rz="${c.k}"></span></th>`).join('')}</tr></thead>`;
  const body=`<tbody>${rows.map((r,ri)=>
    `<tr data-r="${ri}" data-id="${r.id}"${rowStyle(r)}>
      <th data-rh="${ri}"><input type="checkbox" class="rowchk" data-k="${r.id}"${
        PICKED.has(r.id)?' checked':''}><span class="rn">${ri+1}</span><span class="rr"></span></th>${
      cs.map((c,ci)=>`<td data-r="${ri}" data-c="${ci}" class="c-${c.k} ${c.cls||''}${ci===0?' stick1':''}">${cellText(r,c)}</td>`).join('')}
    </tr>`).join('')}</tbody>`;
  w.body.classList.add('gridwin');
  w.body.innerHTML=tools+`<div class="gwrap" id="gwrap"><table class="g">${head}${body}</table></div>`;
  applyRowSize();
  document.getElementById('gcount').innerHTML=rows.length+' of '+AB.length+
    (PICKED.size?` · <b>${PICKED.size} ticked</b> <button class="lnk" id="gclr">clear</button>`:'');
  wireGrid();
  paintSel();
}
function wireGrid(){
  const $=id=>document.getElementById(id);
  $('gq').oninput=e=>{GRID.q=e.target.value;const s=e.target.selectionStart;renderGrid();
    const n=document.getElementById('gq');n.focus();n.setSelectionRange(s,s);};
  $('gfd').onchange=e=>{GRID.fd=e.target.value;renderGrid();};
  $('gfs').onchange=e=>{GRID.fs=e.target.value;renderGrid();};
  $('gfp').onchange=e=>{GRID.fp=e.target.value;renderGrid();};
  $('gfx').onchange=e=>{GRID.fx=e.target.value;renderGrid();};
  $('gadd').onclick=addRow;
  $('gdel').onclick=deleteSelected;
  $('gplan').onclick=()=>addPickedToPlan();
  $('gcols').onclick=openCols;
  $('gpdf').onclick=exportPDF;
  const allBox=$('gall');
  if(allBox)allBox.onchange=()=>{ GRID.rows.forEach(r=>allBox.checked?PICKED.add(r.id):PICKED.delete(r.id));
    renderGrid();};
  document.querySelectorAll('#gwrap .rowchk').forEach(cb=>cb.onclick=e=>{
    e.stopPropagation();
    const id=+cb.dataset.k; cb.checked?PICKED.add(id):PICKED.delete(id);
    document.getElementById('gcount').innerHTML=GRID.rows.length+' of '+AB.length+
      (PICKED.size?` · <b>${PICKED.size} ticked</b> <button class="lnk" id="gclr">clear</button>`:'');
    const c=$('gclr'); if(c)c.onclick=()=>{PICKED.clear();renderGrid();};});
  if($('gclr'))$('gclr').onclick=()=>{PICKED.clear();renderGrid();};
  $('gtalk').onclick=()=>{const r=GRID.rows[GRID.cur.r];
    if(r)openDiscussion(r); else toast('Pick a row first');};


  const wrap=$('gwrap'), tbl=wrap.querySelector('table');
  /* sort + column drag + resize */
  tbl.querySelectorAll('thead th[data-k]').forEach(th=>{
    th.onclick=e=>{ if(e.target.classList.contains('cr'))return;
      const k=th.dataset.k;
      GRID.sort=(GRID.sort.k===k)?{k,dir:-GRID.sort.dir}:{k,dir:1}; renderGrid();};
    th.ondragstart=e=>{e.dataTransfer.setData('text/plain',th.dataset.k);th.classList.add('drag');};
    th.ondragend=()=>th.classList.remove('drag');
    th.ondragover=e=>e.preventDefault();
    th.ondrop=e=>{e.preventDefault();
      const from=e.dataTransfer.getData('text/plain'), to=th.dataset.k;
      if(!from||from===to)return;
      const o=PREFS.order.filter(k=>k!==from), i=o.indexOf(to);
      o.splice(i<0?o.length:i,0,from); PREFS.order=o; savePrefs(); renderGrid();};
    const cr=th.querySelector('.cr');
    cr.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      const k=cr.dataset.rz, x0=e.clientX, w0=colW(COLBY[k]);
      const mv=ev=>{PREFS.w[k]=Math.round(Math.max(46,w0+(ev.clientX-x0)));
        th.style.width=th.style.minWidth=PREFS.w[k]+'px';};
      const up=()=>{document.removeEventListener('pointermove',mv);
        document.body.style.cursor='';savePrefs();renderGrid();};
      document.body.style.cursor='col-resize';
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up,{once:true});});
    /* double-click the edge to fit the column to what is in it */
    cr.addEventListener('dblclick',e=>{
      e.stopPropagation();e.preventDefault();
      const k=cr.dataset.rz, c=COLBY[k];
      const probe=document.createElement('span');
      probe.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;'+
        'font:12px '+getComputedStyle(document.body).fontFamily;
      document.body.appendChild(probe);
      const measure=(txt,pad)=>{
        probe.textContent=txt;
        /* offsetWidth is 0 in some contexts — fall back to the character count */
        return Math.max(probe.offsetWidth, txt.length*6.6)+pad;
      };
      let wid=measure(c.t,36);
      GRID.rows.slice(0,400).forEach(r=>{
        wid=Math.max(wid, Math.min(measure(String(r[k]??''),24), 520));});
      probe.remove();
      PREFS.w[k]=Math.round(Math.max(46,wid)); savePrefs(); renderGrid();
      toast(c.t+' fitted to its contents');});
  });
  /* row height — this row on its own, or every row with Shift held */
  tbl.querySelectorAll('tbody th .rr').forEach(rr=>{
    rr.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      const th=rr.closest('th[data-rh]');
      const row=GRID.rows[+th.dataset.rh]; if(!row)return;
      const tr=th.parentElement;
      const all=e.shiftKey;
      const h0=all?(PREFS.rowh||46)
                  :((PREFS.rowhs&&PREFS.rowhs[row.id])||PREFS.rowh||46);
      const y0=e.clientY;
      document.body.style.cursor='ns-resize';
      const mv=ev=>{
        const h=Math.max(22,Math.min(240,h0+(ev.clientY-y0)));
        if(all){ PREFS.rowh=h; applyRowSize(); }
        else{ PREFS.rowhs[row.id]=h; tr.setAttribute('style',rowVars(h)); }
      };
      const up=()=>{document.removeEventListener('pointermove',mv);
        document.body.style.cursor='';savePrefs();
        toast(all?'All rows resized':'Row '+(row.snag_no||'')+' resized — Shift-drag for all');};
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up,{once:true});});
    rr.addEventListener('dblclick',e=>{
      e.stopPropagation();e.preventDefault();
      const th=rr.closest('th[data-rh]');
      const row=GRID.rows[+th.dataset.rh]; if(!row)return;
      if(e.shiftKey){ PREFS.rowh=46; PREFS.rowhs={}; applyRowSize(); renderGrid();
        toast('Every row back to normal'); }
      else{ delete PREFS.rowhs[row.id]; th.parentElement.removeAttribute('style');
        toast('Row back to normal'); }
      savePrefs();});
  });
  /* row header selects the whole row */
  tbl.querySelectorAll('tbody th[data-rh]').forEach(th=>{
    th.onclick=()=>{const r=+th.dataset.rh;
      GRID.sel={r1:r,c1:0,r2:r,c2:visCols().length-1};GRID.cur={r,c:0};paintSel();};
    th.ondblclick=()=>{const r=GRID.rows[+th.dataset.rh];if(r)openDiscussion(r);};});

  /* cell selection */
  let dragging=false;
  let downAt=null;
  tbl.addEventListener('pointerdown',e=>{
    /* an open editor owns its own clicks — stealing focus here was closing
       the status dropdown the instant it was pressed */
    if(e.target.closest('.cellin'))return;
    const td=e.target.closest('td[data-c]'); if(!td)return;
    const r=+td.dataset.r,c=+td.dataset.c;
    if(e.shiftKey&&GRID.sel){GRID.sel={...GRID.sel,r2:r,c2:c};}
    else {GRID.sel={r1:r,c1:c,r2:r,c2:c};GRID.cur={r,c};}
    dragging=true;downAt={r,c,x:e.clientX,y:e.clientY};paintSel();
    wrap.focus();
  });
  tbl.addEventListener('pointerover',e=>{
    if(!dragging)return; const td=e.target.closest('td[data-c]'); if(!td)return;
    GRID.sel={...GRID.sel,r2:+td.dataset.r,c2:+td.dataset.c};paintSel();});
  document.addEventListener('pointerup',()=>{dragging=false;},{once:false});
  /* one click opens the cell — as long as it was a click and not a drag */
  tbl.addEventListener('click',e=>{
    if(e.target.closest('.cellin'))return;
    const td=e.target.closest('td[data-c]'); if(!td||!downAt)return;
    if(Math.abs(e.clientX-downAt.x)>4||Math.abs(e.clientY-downAt.y)>4)return;
    const r=+td.dataset.r,c=+td.dataset.c;
    if(r!==downAt.r||c!==downAt.c)return;
    beginEdit(r,c);});
  tbl.addEventListener('dblclick',e=>{
    if(e.target.closest('.cellin'))return;
    const td=e.target.closest('td[data-c]'); if(td)beginEdit(+td.dataset.r,+td.dataset.c);});
  wrap.tabIndex=0;
  wrap.addEventListener('keydown',gridKey);
}

function filterLabel(){
  const bits=[];
  if(MOBILE){
    if(MOB.fd)bits.push(MOB.fd);
    if(MOB.fs)bits.push('Code '+MOB.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(MOB.f&&m[MOB.f])bits.push(m[MOB.f]);
    if(MOB.q)bits.push('Search: "'+MOB.q+'"');
  }else{
    if(GRID.fd)bits.push(GRID.fd);
    if(GRID.fs)bits.push('Code '+GRID.fs);
    const m={open:'Open items only',ur:'Under review',late:'Past target date',ns:'Not submitted'};
    if(GRID.fx&&m[GRID.fx])bits.push(m[GRID.fx]);
    if(GRID.q)bits.push('Search: "'+GRID.q+'"');
  }
  return bits.length?bits.join(' · '):'Complete register — no filter applied';
}
function reportRows(){ return MOBILE?mobRows():(GRID&&GRID.rows?GRID.rows:AB); }
function buildReport(){
  const rows=reportRows(), cols=reportCols();
  const n=rows.length;
  const openN=rows.filter(isOpen).length, closedN=n-openN;
  const pct=n?Math.round(closedN/n*100):0;
  const hcis=rows.filter(r=>r.hcis&&isOpen(r)).length;
  const late=rows.filter(r=>isOpen(r)&&r.target_date&&r.target_date<today).length;
  const none=rows.filter(r=>isOpen(r)&&!r.assignee).length;
  const stamp=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});

  const cell=(r,c)=>{
    let v=c.calc?c.calc(r):(r[c.k]??'');
    if(c.k==='status')v=v||'Open';
    if(c.k==='discipline')v=PRINT_DISC[v]||v;
    return v||'—';
  };
  const head=cols.map(c=>`<th class="c-${c.k}">${esc(PRINT_HEAD[c.k]||c.t)}</th>`).join('');
  const body=rows.map((r,i)=>`<tr><td class="c-idx">${i+1}</td>`+
      cols.map(c=>`<td class="c-${c.k}">${esc(cell(r,c))}</td>`).join('')+`</tr>`).join('');

  const kpi=(l,v)=>`<div class="rk"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="rhead">
      <div class="rt"><h1>NWC Handover — Snag Register</h1>
        <div class="rs">D2 · D5 · K2 · Q1</div></div>
      <div class="rd">${stamp}<br><span>${n} document${n===1?'':'s'}</span></div>
    </div>
    <div class="rfilt"><b>Selection:</b> ${esc(filterLabel())}</div>
    <div class="rkpis">
      ${kpi('In selection',n)}${kpi('Closed',pct+'%')}${kpi('Still open',openN)}
      ${kpi('HCIS open',hcis)}${kpi('Past target',late)}${kpi('Unassigned',none)}
    </div>

function exportPDF(){
  const rows=reportRows();

function showTip(html,x,y){ const t=tip(); t.innerHTML=html; t.classList.add('on');

  t.style.left=Math.min(window.innerWidth-r.width-10,Math.max(8,x-r.width/2))+'px';

const isOpen=r=>r.status!=='Closed';
function stats(){
  const t=AB.length, open=AB.filter(isOpen).length;
  const by=(k,v)=>AB.filter(r=>r[k]===v);
  const projects=[...new Set(AB.map(r=>r.project).filter(Boolean))].sort();
  return {t, open, closed:t-open,
    pct: t?Math.round((t-open)/t*1000)/10 : 0,
    hcisOpen: AB.filter(r=>r.hcis&&isOpen(r)).length,
    hcisTotal: AB.filter(r=>r.hcis).length,
    overdue: AB.filter(r=>isOpen(r)&&r.target_date&&r.target_date<today).length,
    unassigned: AB.filter(r=>isOpen(r)&&!r.assignee).length,
    projects: projects.map(p=>({p, t:by('project',p).length,
      open:by('project',p).filter(isOpen).length}))};
}
function groupRows(key){
  const m={};
  AB.forEach(r=>{ const k=r[key]||'(not set)';
    (m[k]=m[k]||{k,t:0,open:0}); m[k].t++; if(isOpen(r))m[k].open++; });
  return Object.values(m).sort((a,b)=>b.open-a.open||b.t-a.t);
}

/* ---------- a matrix: which discipline is holding which project up ---------- */
function heatMatrix(){
  const projects=[...new Set(AB.map(r=>r.project).filter(Boolean))].sort();
  const discs=[...new Set(AB.map(r=>r.discipline).filter(Boolean))]
    .sort((a,b)=>AB.filter(r=>r.discipline===b&&isOpen(r)).length-
                 AB.filter(r=>r.discipline===a&&isOpen(r)).length);
  if(!projects.length||!discs.length)return '<div class="empty">Nothing recorded.</div>';
  const cell=(d,p)=>AB.filter(r=>r.discipline===d&&r.project===p&&isOpen(r)).length;
  const max=Math.max(1,...discs.flatMap(d=>projects.map(p=>cell(d,p))));
  return `<table class="heat"><thead><tr><th></th>${
      projects.map(p=>`<th>${esc(p)}</th>`).join('')}<th class="tot">All</th></tr></thead><tbody>
    ${discs.map(d=>{
      const rowTot=projects.reduce((t,p)=>t+cell(d,p),0);
      return `<tr><th title="${esc(d)}">${esc(d)}</th>${projects.map(p=>{
        const n=cell(d,p), f=n/max;
        return `<td data-fd="${esc(d)}" data-fp="${esc(p)}" data-fx="open"
          style="background:${n?`color-mix(in srgb, ${C_OPEN} ${Math.round(12+f*70)}%, transparent)`:'transparent'};

function importExcel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f)return;
    try{
      const X=await ensureXLSX();
      const wb=X.read(await f.arrayBuffer(),{type:'array'});
      const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      if(aoa.length<2)return toast('That sheet looks empty');
      const head=aoa[0].map(h=>String(h).trim().toLowerCase());
      const map=head.map(h=>{const c=COLS.find(c=>c.t.toLowerCase()===h||c.k.toLowerCase()===h);
        return c&&!c.ro?c.k:null;});
      if(!map.some(Boolean))return msgBox('Import from Excel','',
        'None of the headings matched. Use the same headings as the register — '+
        'export it first if you want a template.',[['Close',null,'primary']]);
      const dn=map.indexOf('ref');
      msgBox('Import '+(aoa.length-1)+' row(s)?','',
        `Matching on <b>Snag no.</b>: rows that already exist are updated, new numbers are added.
         Columns matched: ${map.filter(Boolean).map(k=>esc(COLBY[k].t)).join(', ')}.`,
        [['Cancel',null,''],['Import',async()=>{
          txBegin('import '+(aoa.length-1)+' row(s)');
          let upd=0,add=0;
          for(let i=1;i<aoa.length;i++){
            const line=aoa[i]; if(!line.join('').trim())continue;
            const no=dn>=0?String(line[dn]||'').trim():'';
            let row=no?AB.find(r=>r.ref===no):null;
            if(!row){
              const base={sn:String(AB.length+1),ref:no,title:'',
                discipline:'',reviewClass:'',status:'Not Submitted'};
              row=await apiInsert(base); AB.push(row); txPush({t:'add',id:row.id,row:base}); add++;
            } else upd++;
            for(let j=0;j<map.length;j++){
              if(!map[j])continue;
              const v=String(line[j]??'').trim(); if(v==='')continue;
              await setCell(row,map[j],v,true);
            }
          }
          txEnd(); refresh(); toast(add+' added, '+upd+' updated');
        },'primary']]);
    }catch(e){ console.error(e); toast('Could not read that file'); }
  };
  inp.click();
}

function whenSeen(ts){
  if(!ts)return {t:'Never used it',cls:'never'};
  const d=new Date(ts), mins=Math.round((Date.now()-d)/60000);
  if(mins<2)return {t:'Just now',cls:'now'};
  if(mins<60)return {t:mins+' min ago',cls:'now'};
  if(mins<24*60)return {t:Math.round(mins/60)+'h ago',cls:'now'};
  const days=Math.round(mins/1440);
  if(days<8)return {t:days+'d ago',cls:''};
  return {t:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}),cls:''};
}

function beginEdit(r,c){
  const cs=visCols(), col=cs[c], row=GRID.rows[r];
  if(!col||!row)return;
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  if(col.ro)return toast(col.t+' is worked out automatically');
  const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if(!td)return;
  GRID.editing={r,c};
  const cur=row[col.k]??'';
  let el;
  if(col.opts){ el=document.createElement('select');
    el.innerHTML=col.opts().map(o=>`<option${String(cur)===String(o)?' selected':''}>${esc(o)}</option>`).join('');
  }else{ el=document.createElement('input'); el.type=col.date?'date':'text'; el.value=cur; }
  el.className='cellin'; td.appendChild(el); el.focus();
  if(el.select&&el.tagName==='INPUT')el.select();
  const done=async(commit)=>{
    if(GRID.editing===null)return; GRID.editing=null;
    const v=el.value;
    el.remove();
    if(commit)await setCell(row,col.k,v);
    else renderGrid();
    const wrap=document.getElementById('gwrap'); if(wrap)wrap.focus();
  };
  if(el.tagName==='SELECT'){
    /* opening the native list can blur in some browsers — only the choice,
       or moving away for good, should end the edit */
    el.addEventListener('change',()=>done(true));
    el.addEventListener('blur',()=>setTimeout(()=>{
      if(GRID.editing&&document.activeElement!==el)done(true); },140));
  }else{
    el.addEventListener('blur',()=>done(true));
  }
  el.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter'){ev.preventDefault();done(true);}
    if(ev.key==='Escape'){ev.preventDefault();done(false);}
    if(ev.key==='Tab'){ev.preventDefault();done(true).then(()=>{
      GRID.cur={r,c:Math.min(c+1,cs.length-1)};GRID.sel={r1:r,c1:GRID.cur.c,r2:r,c2:GRID.cur.c};paintSel();});}
  });
}

async function gridKey(e){
  if(GRID.editing)return;
  const cs=visCols(), maxR=GRID.rows.length-1, maxC=cs.length-1;
  const mv=(dr,dc,ext)=>{
    const r=Math.max(0,Math.min(maxR,GRID.cur.r+dr)), c=Math.max(0,Math.min(maxC,GRID.cur.c+dc));
    GRID.cur={r,c};
    GRID.sel=ext&&GRID.sel?{...GRID.sel,r2:r,c2:c}:{r1:r,c1:c,r2:r,c2:c};
    paintSel();
    const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});
  };
  const k=e.key;
  if(k==='ArrowDown'){e.preventDefault();mv(1,0,e.shiftKey);}
  else if(k==='ArrowUp'){e.preventDefault();mv(-1,0,e.shiftKey);}
  else if(k==='ArrowLeft'){e.preventDefault();mv(0,-1,e.shiftKey);}
  else if(k==='ArrowRight'||k==='Tab'){e.preventDefault();mv(0,1,e.shiftKey&&k!=='Tab');}
  else if(k==='Enter'){e.preventDefault();beginEdit(GRID.cur.r,GRID.cur.c);}
  else if(k==='Delete'||k==='Backspace'){e.preventDefault();await clearSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='c'){e.preventDefault();copySel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'){e.preventDefault();
    GRID.sel={r1:0,c1:0,r2:maxR,c2:maxC};paintSel();}
  else if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();}
  else if((e.ctrlKey||e.metaKey)&&(k.toLowerCase()==='y'||(e.shiftKey&&k.toLowerCase()==='z'))){e.preventDefault();redo();}
  else if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    beginEdit(GRID.cur.r,GRID.cur.c);
    const el=document.querySelector('.cellin');
    if(el&&el.tagName==='INPUT'){el.value=k;}
  }
}

function copySel(){
  const cells=selCells(); if(!cells.length)return;
  const {r1,r2,c1,c2}=GRID.sel;
  const [ra,rb]=[Math.min(r1,r2),Math.max(r1,r2)],[ca,cb]=[Math.min(c1,c2),Math.max(c1,c2)];
  const cs=visCols(), lines=[];
  for(let r=ra;r<=rb;r++){
    const row=GRID.rows[r]; if(!row)continue;
    const cells=[];
    for(let c=ca;c<=cb;c++){const col=cs[c]; cells.push(col.calc?col.calc(row):(row[col.k]??''));}
    lines.push(cells.join('\t'));
  }
  const txt=lines.join('\r\n');
  navigator.clipboard.writeText(txt).then(()=>toast(lines.length+' row(s) copied'))
    .catch(()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('Copied');});
}

function parseTSV(txt){
  return txt.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
}

async function pasteIntoSel(txt){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const data=parseTSV(txt); if(!data.length)return;
  const cs=visCols(), {r1,c1,r2,c2}=GRID.sel||{r1:0,c1:0,r2:0,c2:0};
  const ra=Math.min(r1,r2), ca=Math.min(c1,c2);
  txBegin('paste');
  let n=0,skipped=0;
  for(let i=0;i<data.length;i++){
    const row=GRID.rows[ra+i]; if(!row)break;
    for(let j=0;j<data[i].length;j++){
      const col=cs[ca+j]; if(!col)break;
      if(col.ro){skipped++;continue;}
      await setCell(row,col.k,data[i][j].trim(),true); n++;
    }
  }
  txEnd(); renderGrid();
  toast(n+' cell(s) pasted'+(skipped?', '+skipped+' calculated cell(s) skipped':''));
}

async function clearSel(){
  if(!canEdit())return toast(LIVE?'Your account cannot edit':'Read-only snapshot');
  const cells=selCells().filter(x=>!x.col.ro); if(!cells.length)return;
  txBegin('clear '+cells.length+' cell(s)');
  for(const {row,col} of cells) await setCell(row,col.k,'',true);
  txEnd(); renderGrid(); toast(cells.length+' cell(s) cleared');
}

/* ============================================================
   Weekly closure plans
   A week holds the snags the team means to close in that week.
   An item is done the moment the snag's status turns Closed —
   nothing separate to tick off.
   ============================================================ */
let ASSIGNEES=[], PLANS=[], PITEMS={};
let PLAN_CUR=null, _planBusy=false;
const WEEK_DAYS=6;                       /* Sunday to Friday */

const weekStartOf=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+1)%7));
  return x.toISOString().slice(0,10);};
const weekEndOf=ws=>{const b=new Date(ws);b.setDate(b.getDate()+WEEK_DAYS-1);
  return b.toISOString().slice(0,10);};
const weekLabel=ws=>{
  const a=new Date(ws), b=new Date(weekEndOf(ws));
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return f(a)+' – '+f(b);};
const planStarted=p=>!!p&&p.week<=today;
const planEnded=p=>!!p&&weekEndOf(p.week)<today;
const planPhase=p=>{
  if(!p)return {k:'none',label:''};
  if(!planStarted(p)){const d=days(today,p.week);
    return {k:'future',label:d===1?'Starts tomorrow':'Starts in '+d+' days'};}
  if(planEnded(p))return {k:'past',label:'Week finished'};
  return {k:'live',label:'Live this week'};};
const assigneeName=id=>{const a=ASSIGNEES.find(x=>x.id===id);return a?a.name:'— nobody named —';};

function weekOptions(back,fwd){
  const out=[], base=new Date(weekStartOf(today));
  for(let i=-back;i<=fwd;i++){
    const d=new Date(base); d.setDate(d.getDate()+i*7);
    const ws=d.toISOString().slice(0,10);
    const taken=PLANS.find(p=>p.week===ws);
    out.push({ws,label:weekLabel(ws),taken:!!taken,planId:taken?taken.id:null,
      note:i===0?'this week':i===1?'next week':i===-1?'last week'
        :i<0?Math.abs(i)+' weeks ago':'in '+i+' weeks'});
  }
  return out;
}

async function loadPlanning(){
  try{ PLANS=await api('snag_plans?order=week.desc'); }catch(e){ PLANS=[]; }
  try{ ASSIGNEES=await api('snag_assignees?active=is.true&order=name.asc'); }
  catch(e){ ASSIGNEES=[]; }
  if(!PLAN_CUR&&PLANS.length){
    const live=PLANS.find(p=>planPhase(p).k==='live');
    PLAN_CUR=(live||PLANS[0]).id;
  }
  if(PLAN_CUR&&!PITEMS[PLAN_CUR])await loadPlanItems(PLAN_CUR);
}
async function loadPlanItems(planId){
  try{ PITEMS[planId]=await api('snag_plan_items?plan_id=eq.'+planId+'&order=id.asc'); }
  catch(e){ PITEMS[planId]=[]; }
  return PITEMS[planId];
}

/* the people who do the closing are kept apart from the login accounts —
   type a name once and it is offered from then on */
async function resolveAssignee(name){
  const n=(name||'').trim();
  if(!n)return null;
  const hit=ASSIGNEES.find(a=>a.name.toLowerCase()===n.toLowerCase());
  if(hit)return hit.id;
  try{
    const made=await api('snag_assignees',{method:'POST',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify({name:n,reportsTo:USER?USER.id:null})});
    const rec=Array.isArray(made)?made[0]:made;
    if(rec&&rec.id){ ASSIGNEES.push(rec); return rec.id; }
  }catch(e){}
  return null;
}
function assigneeField(it){
  const cur=it.assigneeId?assigneeName(it.assigneeId):'';
  return `<input class="pa" list="alist" data-i="${it.id}" value="${esc(cur)}"
    placeholder="who is closing it">`;
}
function assigneeList(){
  return `<datalist id="alist">${ASSIGNEES.map(a=>`<option>${esc(a.name)}</option>`).join('')}</datalist>`;
}

/* an item is done when its snag is closed */
function itemState(it){
  const r=AB.find(x=>x.id===it.snag_id);
  if(!r)return {k:'gone',label:'snag deleted',color:'var(--ink3)'};
  if(r.status==='Closed')
    return {k:'done',label:'Closed'+(r.closed_date?' '+r.closed_date:''),color:'#0f9d58'};
  const late=it.plannedDate&&it.plannedDate<today;
  return {k:'open',label:late?'Open — past '+it.plannedDate:'Still open',
    color:late?'#d64545':'var(--ink2)'};
}
function planProgress(planId){
  const items=PITEMS[planId]||[];
  const done=items.filter(it=>itemState(it).k==='done').length;
  return {done,total:items.length,pct:items.length?Math.round(done/items.length*100):0};
}
function progressBar(planId){
  const p=planProgress(planId);
  return `<div class="pprog"><div class="ptrack"><i style="width:${p.pct}%"></i></div>
    <span>${p.done} of ${p.total} closed · ${p.pct}%</span></div>`;
}

function planRows(planId){
  const items=PITEMS[planId]||[];
  if(!items.length)return '<div class="empty"><b>No snags in this week yet</b>'+
    'Tick snags in the register and press “Add to plan”.</div>';
  return `<table class="ptbl"><thead><tr>
      <th style="width:80px">Snag</th><th>Observation</th><th style="width:120px">Station</th>
      <th style="width:150px">Responsible</th><th style="width:130px">By</th>
      <th style="width:150px">State</th><th style="width:34px"></th></tr></thead><tbody>
    ${items.map(it=>{
      const r=AB.find(x=>x.id===it.snag_id)||{};
      const st=itemState(it);
      return `<tr>
        <td class="mono"><a class="lnk" data-go="${it.snag_id}">${esc(r.snag_no||'—')}</a></td>
        <td>${esc((r.description||'').slice(0,90))}</td>
        <td>${esc(r.station||'')}</td>
        <td>${canEdit()?assigneeField(it):esc(it.assigneeId?assigneeName(it.assigneeId):'—')}</td>
        <td>${canEdit()?`<input class="pd" type="date" data-i="${it.id}"
              value="${esc(it.plannedDate||'')}">`:esc(it.plannedDate||'—')}</td>
        <td style="color:${st.color};font-weight:600">${esc(st.label)}</td>
        <td>${canEdit()?`<button class="lnk" data-rm="${it.id}" title="Take out of the week">✕</button>`:''}</td>
      </tr>`;}).join('')}
    </tbody></table>`+assigneeList();
}

function wirePlans(w){
  const b=w.body;
  const sel=b.querySelector('#pweek');
  if(sel)sel.onchange=async e=>{ PLAN_CUR=+e.target.value;
    if(!PITEMS[PLAN_CUR])await loadPlanItems(PLAN_CUR); drawPlans(); };
  const nw=b.querySelector('#pnew'); if(nw)nw.onclick=newPlanWeek;
  const dl=b.querySelector('#pdel'); if(dl)dl.onclick=deletePlanWeek;
  const pd=b.querySelector('#ppdf'); if(pd)pd.onclick=exportPlanPDF;
  b.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{
    const r=AB.find(x=>x.id===+el.dataset.go); if(r)openDiscussion(r);});
  b.querySelectorAll('.pa').forEach(inp=>inp.onchange=async()=>{
    const who=await resolveAssignee(inp.value);
    await api('snag_plan_items?id=eq.'+inp.dataset.i,
      {method:'PATCH',body:JSON.stringify({assigneeId:who})});
    const it=(PITEMS[PLAN_CUR]||[]).find(x=>x.id===+inp.dataset.i);
    if(it)it.assigneeId=who;
    toast(who?'Given to '+assigneeName(who):'Left unassigned');});
  b.querySelectorAll('.pd').forEach(i=>i.onchange=async()=>{
    await api('snag_plan_items?id=eq.'+i.dataset.i,
      {method:'PATCH',body:JSON.stringify({plannedDate:i.value})});
    const it=(PITEMS[PLAN_CUR]||[]).find(x=>x.id===+i.dataset.i);
    if(it)it.plannedDate=i.value;
    toast('Date set');});
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{
    await api('snag_plan_items?id=eq.'+x.dataset.rm,{method:'DELETE'});
    await loadPlanItems(PLAN_CUR); drawPlans(); toast('Taken out of the week');});
}

function newPlanWeek(){
  if(!canEdit())return toast('Your account cannot edit');
  const opts=weekOptions(2,5).filter(o=>!o.taken);
  if(!opts.length)return toast('Every nearby week already has a plan');
  const dlg=msgBox('New week','','<div class="wlist">'+opts.map(o=>
    `<button class="wopt" data-ws="${o.ws}"><b>${o.label}</b><span>${o.note}</span></button>`
    ).join('')+'</div>',[['Cancel',null,'']]);
  dlg.querySelectorAll('[data-ws]').forEach(b=>b.onclick=async()=>{
    if(_planBusy)return; _planBusy=true;
    try{
      const made=await api('snag_plans',{method:'POST',
        headers:{Prefer:'return=representation'},
        body:JSON.stringify({week:b.dataset.ws,created_by:USER?USER.name:''})});
      const rec=Array.isArray(made)?made[0]:made;
      closeMsg(); await loadPlanning();
      if(rec&&rec.id){PLAN_CUR=rec.id; PITEMS[rec.id]=[];}
      drawPlans(); toast('Week added');
    }catch(e){ toast('Could not add that week'); }
    finally{ _planBusy=false; }});
}
function deletePlanWeek(){
  const plan=PLANS.find(p=>p.id===PLAN_CUR); if(!plan)return;
  const p=planProgress(plan.id);
  msgBox('Delete this week?','',
    `<b>${weekLabel(plan.week)}</b> holds ${p.total} snag(s).<br><br>
     The snags themselves are not touched — only the week is removed.`,
    [['Cancel',null,''],['Delete',async()=>{
      await api('snag_plans?id=eq.'+plan.id,{method:'DELETE'});
      delete PITEMS[plan.id]; PLAN_CUR=null;
      await loadPlanning(); drawPlans(); toast('Week deleted');
    },'danger']]);
}

async function addPickedToPlan(){
  if(!canEdit())return toast('Your account cannot edit');
  const ids=PICKED.size?[...PICKED]:[...new Set(selCells().map(x=>x.row.id))];
  if(!ids.length)return toast('Tick the snags you want to plan first');
  if(!PLANS.length)await loadPlanning();
  const opts=weekOptions(1,5);
  const dlg=msgBox('Add '+ids.length+' snag(s) to a week','',
    '<div class="wlist">'+opts.map(o=>
      `<button class="wopt" data-ws="${o.ws}" data-id="${o.planId||''}">
        <b>${o.label}</b><span>${o.note}${o.taken?' · already planned':''}</span></button>`
      ).join('')+'</div>',[['Cancel',null,'']]);
  dlg.querySelectorAll('[data-ws]').forEach(b=>b.onclick=async()=>{
    if(_planBusy)return; _planBusy=true;
    try{
      let planId=b.dataset.id?+b.dataset.id:null;
      if(!planId){
        const made=await api('snag_plans',{method:'POST',
          headers:{Prefer:'return=representation'},
          body:JSON.stringify({week:b.dataset.ws,created_by:USER?USER.name:''})});
        const rec=Array.isArray(made)?made[0]:made; planId=rec.id;
        await loadPlanning();
      }
      const have=new Set((await loadPlanItems(planId)).map(x=>x.snag_id));
      const add=ids.filter(id=>!have.has(id));
      if(add.length){
        await api('snag_plan_items',{method:'POST',body:JSON.stringify(
          add.map(id=>({plan_id:planId,snag_id:id,
            base_status:(AB.find(x=>x.id===id)||{}).status||'Open',
            plannedDate:weekEndOf(b.dataset.ws)})))});
      }
      closeMsg();
      PLAN_CUR=planId; await loadPlanItems(planId);
      PICKED.clear(); renderGrid();
      const w=[...WINS.values()].find(x=>x.kind==='plan');
      if(w)drawPlans(); else await openPlans();
      toast(add.length?add.length+' added to '+weekLabel(b.dataset.ws)
        :'Those snags were already in that week');
    }catch(e){ toast('Could not add to the plan'); }
    finally{ _planBusy=false; }});
}

/* horizontal swipe on a card: left to remove, right to tick.
   Only engages once the movement is clearly sideways, so the list still scrolls. */
function attachSwipe(el,{onLeft,onRight,leftLabel,rightLabel}){
  let x0=0,y0=0,dx=0,live=false,decided=false;
  const TH=64;
  el.style.touchAction='pan-y';
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    x0=e.clientX;y0=e.clientY;dx=0;live=true;decided=false;});
  el.addEventListener('pointermove',e=>{
    if(!live)return;
    const ax=e.clientX-x0, ay=e.clientY-y0;
    if(!decided){
      if(Math.abs(ay)>Math.abs(ax)){live=false;return;}
      if(Math.abs(ax)<10)return;
      decided=true; el.classList.add('swiping');
    }
    dx=ax;
    if((dx<0&&!onLeft)||(dx>0&&!onRight))dx=0;
    el.style.transform='translateX('+Math.max(-110,Math.min(110,dx))+'px)';
    el.dataset.swipe=dx<-TH?'left':dx>TH?'right':'';
  });
  const end=()=>{
    if(!live){el.style.transform='';el.classList.remove('swiping');return;}
    live=false; el.classList.remove('swiping'); el.style.transform='';
    const hit=el.dataset.swipe; el.dataset.swipe='';
    if(hit==='left'&&onLeft)onLeft();
    if(hit==='right'&&onRight)onRight();
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',end);
  el.addEventListener('pointerleave',end);
}

async function resumeSession(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('snag-session')||'null'); }catch(e){}
  if(!s||!s.r)return false;
  try{
    const n=(s.exp&&s.exp>Date.now()+60000)?{access_token:s.t,refresh_token:s.r,expires_in:(s.exp-Date.now())/1000}
      :await auth('token?grant_type=refresh_token',{refresh_token:s.r});
    TOKEN=n.access_token;
    const me=await api('snag_members?user_id=eq.'+
      (n.user?n.user.id:(JSON.parse(atob(n.access_token.split('.')[1])).sub))+'&limit=1');
    if(!me.length){TOKEN=null;return false;}
    USER={id:me[0].user_id,email:me[0].email,name:me[0].name||me[0].email,role:me[0].role};
    if(me[0].prefs)loadPrefs(me[0].prefs);
    try{localStorage.setItem('snag-session',JSON.stringify(
      {t:n.access_token,r:n.refresh_token||s.r,exp:Date.now()+(n.expires_in||3600)*1000}));}catch(e){}
    return true;
  }catch(e){ TOKEN=null; try{localStorage.removeItem('snag-session');}catch(_){} return false; }
}

  if(a==='cols')openCols(); else if(a==='pdf')exportPDF(); else if(a==='xlsx')exportXLSX(); else if(a==='csv')exportCSV();
  else if(a==='import')importExcel(); else if(a==='bin')openBin();
  else if(a==='snag_activity')openActivity();
  else if(a==='users')openUsers(); else if(a==='arrange')arrangeWins();
  else if(a==='theme')toggleTheme(); else if(a==='mobile')setMobile(true,true);
  else if(a==='logout')logout();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('msgwrap').classList.contains('on'))closeMsg();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!GRID?.editing&&e.target===document.body){e.preventDefault();undo();}
});
window.addEventListener('hashchange',()=>setMobile(isPhone(),false));
boot();

</script>
</body>
